# Lab 7 candidate 3 of 3 under gate-v1. Committed before it was trained or scored.
data: data/raw/hour.csv
features:
  - season
  - yr
  - mnth
  - hr
  - holiday
  - weekday
  - workingday
  - weathersit
  - temp
  - atemp
  - hum
  - windspeed
model:
  n_estimators: 20
  max_depth: 8
  min_samples_leaf: 5
  random_state: 42
  n_jobs: 1
candidate:
  name: c3-small-forest
  hypothesis: >-
    A cheaper forest (20 trees, depth 8, leaves of at least 5 rows) would load
    and answer faster. Prediction: shallower trees lose peak-hour detail, so
    validation MAE should be worse than the incumbent and the candidate should
    fail beats_incumbent. It checks that the rule rejects a regression even
    when the operation numbers improve.
