# Lab 7 candidate 1 of 3 under gate-v1. Committed before it was trained or scored.
data: data/raw/hour.csv
features:
  - season
  - yr
  - mnth
  - hr
  - holiday
  - weekday
  - workingday
  - weathersit
  - temp
  - atemp
  - hum
  - windspeed
model:
  n_estimators: 60
  max_depth: 18
  min_samples_leaf: 2
  random_state: 42
  n_jobs: 1
candidate:
  name: c1-deeper-trees
  hypothesis: >-
    Working-day peak hours are 17% of validation rows but 40% of the
    incumbent's absolute error (MAE 202 vs 86.8 overall). Depth 10 cannot split
    hour x day type x weather finely enough. Trees up to depth 18 with leaves of
    at least 2 rows should cut peak-hour error and lower overall MAE by more
    than the 1.0 rental/h margin. Expected cost: a larger file and slower
    inference, both still inside 64 MiB and 50 ms. It cannot remove the
    -82 rentals/h level bias: 2012 demand is higher than anything in 2011.
