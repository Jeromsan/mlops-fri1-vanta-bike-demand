# Lab 7 candidate 2 of 3 under gate-v1. Committed before it was trained or scored.
data: data/raw/hour.csv
features:
  - season
  - yr
  - mnth
  - hr
  - holiday
  - weekday
  - workingday
  - weathersit
  - temp
  - atemp
  - hum
  - windspeed
model:
  n_estimators: 300
  max_depth: null
  min_samples_leaf: 1
  random_state: 42
  n_jobs: 1
candidate:
  name: c2-fully-grown-forest
  hypothesis: >-
    If accuracy were the only goal, 300 fully grown trees would be the usual
    next step. Prediction: it may lower validation MAE a little more than c1,
    but each unbounded tree stores thousands of nodes, so the file should end
    far above the 64 MiB serving bound. The gate should then reject it on
    model_size even if the quality rules pass.
